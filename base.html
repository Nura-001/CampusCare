{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusCare{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="{% url 'home' %}">CampusCare</a>
      <nav class="nav-links">
        <a href="{% url 'home' %}">Home</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      &copy; CampusCare - Smart Campus Service &amp; Complaint Management System
    </div>
  </footer>
</body>
</html>
